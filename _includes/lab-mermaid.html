<script type="module">
  // Draws the page's Mermaid code blocks (included only on pages that have one).
  // GitHub Pages emits a fenced ```mermaid block in one of two shapes:
  //   <pre><code class="language-mermaid">…</code></pre>   (Rouge has no Mermaid lexer; seen on the live site)
  //   <div class="language-mermaid highlighter-rouge"><div class="highlight"><pre class="highlight"><code>…
  // Both are handled. Each diagram is rendered first and swapped in only on
  // success, so if this script, the CDN, or a diagram fails, the source stays
  // visible as the readable fallback. Mermaid is loaded and initialized once.
  const sources = document.querySelectorAll("code.language-mermaid, div.language-mermaid code");
  if (sources.length > 0) {
    try {
      const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "strict",
        theme: "base",
        themeVariables: {
          primaryColor: "#fff6e9",
          primaryBorderColor: "#7c334f",
          primaryTextColor: "#544943",
          lineColor: "#7c334f",
          fontFamily: "'Open Sans', Myriad, Calibri, sans-serif",
        },
      });
      let index = 0;
      for (const code of sources) {
        const block = code.closest("div.language-mermaid") || code.closest("pre") || code;
        try {
          const { svg } = await mermaid.render(`lab-mermaid-${index++}`, code.textContent);
          const diagram = document.createElement("div");
          diagram.className = "mermaid";
          diagram.innerHTML = svg;
          block.replaceWith(diagram);
        } catch (error) {
          console.warn("Mermaid diagram not rendered; showing its source instead.", error);
        }
      }
    } catch (error) {
      console.warn("Mermaid couldn't be loaded; showing diagram source instead.", error);
    }
  }
</script>
