[project]
name = "winery-api-document-lab"
version = "0.1.0"
description = "A small FastAPI winery production API used as the teaching fixture for a document automation learning lab."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ken W. Alger" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
